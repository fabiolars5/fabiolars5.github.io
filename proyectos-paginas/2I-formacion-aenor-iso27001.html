<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="0; url=2G-gestion-riesgos.html" />
  <meta name="robots" content="noindex, follow" />
  <link rel="canonical" href="https://fabiolars5.github.io/proyectos-paginas/2G-gestion-riesgos.html" />
  <title>Formación AENOR ISO/IEC 27001 · Fabiola RS</title>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #0f1625;
      --tx: #f3f5fa;
      --muted: #a2a7b7;
      --card: #1a2234;
      --bd: #2b3349;
      --acc: #00bfae;
      --acc-soft: #14d1c5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px;
      font-family: Montserrat, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--tx);
      line-height: 1.6;
    }

    main {
      max-width: 680px;
      padding: 28px;
      border-radius: 14px;
      border: 1px solid var(--bd);
      background: var(--card);
      box-shadow: 0 18px 48px rgba(0, 0, 0, .24);
    }

    .kicker {
      margin: 0 0 8px;
      color: var(--acc-soft);
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(1.55rem, 4vw, 2rem);
      line-height: 1.25;
    }

    p {
      margin: 0 0 18px;
      color: var(--muted);
    }

    a {
      display: inline-flex;
      align-items: center;
      padding: 10px 16px;
      border-radius: 999px;
      background: var(--acc);
      color: #0f1625;
      text-decoration: none;
      font-weight: 800;
    }

    a:hover {
      background: var(--acc-soft);
    }
  </style>
</head>
<body>
  <main>
    <p class="kicker">Contenido consolidado</p>
    <h1>Formación AENOR integrada en Seguridad de la información</h1>
    <p>
      Esta página se ha unificado con la sección de Seguridad de la información para evitar contenido duplicado en el portfolio.
    </p>
    <a href="2G-gestion-riesgos.html">Ir a Seguridad de la información</a>
  </main>

  <script>
    window.location.replace("2G-gestion-riesgos.html");
  </script>
</body>
</html>
